# beets config for navidrome-upload. The library database and the target
# directory come from the command line, one fresh database per import.
import:
  # From the job's in/ to its out/ folder, both on local disk; the importer
  # moves the tracks that are not duplicates on into the library.
  move: yes
  write: yes
  # No prompts: apply only confident MusicBrainz matches, import the rest with
  # the tags it came with.
  quiet: yes
  quiet_fallback: asis
  # Tracks are split into albums by their tags, wherever they were uploaded.
  group_albums: yes
  # An album whose tracks arrive by different routes in one upload is found
  # twice; the database only holds this import, so join the parts.
  duplicate_action: merge
  resume: no
  incremental: no
  log: null

# Untagged tracks would land in "_" folders as "00.mp3": fromfilename takes
# the title (and a track number) from the file name, and these fill the rest.
paths:
  default: '%if{$albumartist,$albumartist,Unknown Artist}/%if{$album,$album,Unknown Album}%aunique{}/%if{$track,$track }$title'
  singleton: '%if{$artist,$artist,Unknown Artist}/Non-Album/$title'
  comp: 'Compilations/%if{$album,$album,Unknown Album}%aunique{}/%if{$track,$track }$title'

# Imports already run one at a time; one thread each keeps beets to one core.
threaded: no

# Since beets 2.x MusicBrainz matching is a plugin; a plugins list without it
# imports everything as-is.
plugins: musicbrainz fetchart fromfilename

# cover.jpg beside the tracks for MusicBrainz matches. Uploads carry no
# images; other albums show the art embedded in their files.
fetchart:
  sources: [coverart, itunes]

ui:
  color: no
